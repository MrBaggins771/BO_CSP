<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Color with style</title>
        <meta charset="UTF-8">
        <style>
            body{
                background-color: gray;
            }
            #complimentary{
                background-color: yellow;
                border: 5px solid yellow;
                height: 200px;
                width: 200Px;
                color: yellow;
                font-size: 2em;
                text-align: center;
            }
            #analogous{
                background-color: greenyellow;
                border: 5px solid greenyellow;
                height: 200px;
                width: 200Px;
                color: yellow;
                font-size: 2em;
                text-align: center;
            }
            #triadic{
                background-color: red;
                border: 5px solid red;
                height: 200px;
                width: 200Px;
                color: yellow;
                font-size: 2em;
                text-align: center;
            }
            #com-p{
                background-color: blueviolet;
            }
            #ana-p{
                background-color: green;
            }
            #tri-p{
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <div id="complimentary">
            <p id="com-p">These are complimentary colors</p>
        </div>
        <div id="analogous">
            <p id="ana-p">These are analogous colors</p>
        </div>
        <div id="triadic">
            <p id="tri-p">These are triadic colors</p>
        </div>
    </body>

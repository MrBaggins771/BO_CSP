<!--Hypertext Markup Language-->
<!DOCTYPE html> <!--Tell the computer this is HTML-->
<html lang="en">
    <head><!--Holds info for web browser; not seen on webpage-->
        <title>HTML Basics Notes</title>
        <meta charset="UTF-8"><!--Self closing tag, no closer tag-->
    </head>
    <body>
        <h1>This is a lvl 1 header </h1>
        <h2>This is a lvl 2 header </h2>
        <h6>This is a lvl 6 header </h6>
        <p><em>Basic</em> <b>paragraph</b></p>
        <p> New basic paragraph<br><u>New Line</u></p>
    </body>
</html>

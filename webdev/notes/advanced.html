<!--BO 3 CSP Advanced HTML Notes-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced HTML notes</title>
        <meta charset="UTF-8">
            <!--Embeded CSS-->
            <!--Selectors change parts of HTML, properties are what about the HTML, value is the change.-->
            <!--The declaration is the entire line with property and value.-->
            <!--If you change comthing twice the second one is the one that shows.-->
            <!--instead of spaces we use "-" -->
            <!--for colors you can have the name, RGB or HEX-->
            <!--you can find colors on th internet or with the color picker-->
            <!--You can change size in the style-->
            <!--having changing sizes helps with different screen sizes-->
            <style>
                *{
                    background-color: rgb(131, 245, 141);
                    
                }
                p{
                    background-color: black;
                    color: aqua;
                    background-color: teal;
                    text-align: right;
                    font-size: 1em;
                }
                #ordered-lists{
                    background-color: bisque;
                    color: chocolate;
                }
                .odd{
                    background-color: green;
                    color: white;
                }
                h1{
                    text-align: center;
                    color: #ce6bce;
                    border: 2px solid yellow;
                }
                img{
                    width: 25%;
                    height: 25%;
                }
            </style>
    </head>
    <body>
        <h1>HTML Advanced notes</h1>
        <!--The two types of lists are ordered and unordered lists-->
        <!--The tree different tags are OL UL and LI-->
        <div id="ordered-lists">
        <p>Ordered list</p>
        <ol><!--Only li tags nothing else-->
            <li class="odd">a</li>
            <li>b</li>
            <li class="odd">c</li>
            <li>d</li>
        </ol>
        </div>
        <br>
        <div id="unordered-lists">
        <p>Unordered list</p>
        <ul style="list-style-type:square">
            <!--This is an atribute (extra info for opening tag that makes the tag do more)-->
            <!--Atributes are written with the atribute name ="atribute content"-->
            <li class="odd">Apple</li>
            <li>Orange</li>
            <li class="odd">Banana</li>
        </ul>
        </div>
        <a href="https://ucas-edu.instructure.com/courses/4362/assignments/89779" target="_blank">Assignment Page</a>
        <br>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Smiley.svg/250px-Smiley.svg.png" alt="smile" height="150px"> <!--IMG tag is used to include an image (src and alt are required)-->
        <!--Self closing tags do not require a closing tag and close themselves-->
        <div style="background-color: blueviolet; height: 100px; width: 200px;"></div>
    
        <!--CSS notes (Cascading style sheets)-->
        <!--Inline styles are done in the HTML opening tag. BAD PRACTICE-->
        <!--Embeded CSS goes in the head tags using the <style> tag.-->
    </body>
</html>

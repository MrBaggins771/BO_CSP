<!DOCTYPE html>
<html lang="en">
    <head>
        <title>JS Notes</title>
        <meta charset="UTF-8">
        <script>
            function hello(){
                document.getElementById("title").innerHTML="Hello World"
            }
        </script>
        <style>
            #btn{
                height: 100px;
                width: 200px;
                background-color: rgb(187, 120, 120);
                border-radius: 3px;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <h1 id="title">JavaScript Notes</h1>
        <button id="btn" onclick="hello()">Click Me!</button>
    </body>
</html>
